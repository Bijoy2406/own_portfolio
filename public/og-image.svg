<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#27272a" stroke-width="1" opacity="0.5"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top-left terminal-style marker -->
  <g transform="translate(72, 64)" fill="#a1a1aa" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20">
    <circle cx="10" cy="10" r="6" fill="#ef4444" opacity="0.7"/>
    <circle cx="36" cy="10" r="6" fill="#f59e0b" opacity="0.7"/>
    <circle cx="62" cy="10" r="6" fill="#10b981" opacity="0.9"/>
    <text x="92" y="16" letter-spacing="2">SYS_INIT // portfolio.exe</text>
  </g>

  <!-- Emerald accent bar -->
  <rect x="72" y="232" width="64" height="6" fill="#10b981"/>

  <!-- Name -->
  <text x="72" y="320" fill="#f4f4f5" font-size="96" font-weight="600" letter-spacing="-2">Tajuddin Ahmed Bijoy</text>

  <!-- Title -->
  <text x="72" y="392" fill="#34d399" font-size="44" font-weight="400">Full-Stack Web Developer</text>

  <!-- Divider -->
  <line x1="72" y1="442" x2="180" y2="442" stroke="#3f3f46" stroke-width="1"/>

  <!-- Tagline -->
  <text x="72" y="490" fill="#a1a1aa" font-size="26" font-weight="400">Building real products with React, Next.js &amp; TypeScript.</text>

  <!-- Footer row -->
  <g transform="translate(72, 562)" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22">
    <text x="0" y="0" fill="#a1a1aa" letter-spacing="1">bijoy.ami.bd</text>
    <text x="1056" y="0" fill="#52525b" letter-spacing="1" text-anchor="end">// portfolio</text>
  </g>
</svg>